name = "retro-hangul-downloads"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[r2_buckets]]
binding = "PATCH_BUCKET"
bucket_name = "retro-hangul-private"

[vars]
GITHUB_CLIENT_ID = "REPLACE_WITH_CLIENT_ID"
GITHUB_CALLBACK_URL = "https://REPLACE_WITH_WORKER_URL/auth/callback"
ACCESS_MODE = "verified"
APPROVED_GITHUB_IDS = ""
DOWNLOADS_JSON = "{}"
