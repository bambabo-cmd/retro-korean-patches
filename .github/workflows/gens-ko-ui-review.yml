name: Gens KO 신규 모듈과 설정 화면

on:
  push:
    branches: [main]
    paths:
      - 'emulators/gens-ko/**'
      - '.github/workflows/gens-ko-ui-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gens-ko-ui-review
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 빌드 도구 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 g++ g++-mingw-w64-i686 binutils-mingw-w64-i686 zlib1g-dev python3-pil python3-numpy libegl1 libgl1-mesa-dri
      - name: 입력 및 기록 논리 검사
        working-directory: emulators/gens-ko
        run: |
          python3 tests/run_public_checks.py
          python3 tests/test_renderer_feedback.py
      - name: Real CRT 원본과 포트 출력 비교
        working-directory: emulators/gens-ko
        run: python3 tests/test_real_crt_phosphor.py
      - uses: actions/upload-artifact@v4
        with:
          name: gens-ko-real-crt-proof
          path: emulators/gens-ko/build/real_crt_phosphor/**
          if-no-files-found: error
          retention-days: 30
      - name: 실제 설정 UI 구성 요소 빌드
        working-directory: emulators/gens-ko
        run: python3 build_shader_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: gens-ko-settings-probe
          path: |
            emulators/gens-ko/build/shader_probe/Gens_KO_Settings_Probe.exe
            emulators/gens-ko/build/shader_probe/build-record.json
            emulators/gens-ko/build/shader_probe/LICENSE.txt
            emulators/gens-ko/build/shader_probe/shaders/
          if-no-files-found: error
          retention-days: 7

  capture:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gens-ko-settings-probe
          path: probe
      - name: 검사 전용 Mesa 소프트웨어 OpenGL 준비
        shell: powershell
        run: |
          & emulators/gens-ko/tests/setup_mesa_ci.ps1 -ProbeDirectory probe -RuntimeDirectory "$env:RUNNER_TEMP/gens-ko-mesa-runtime"
      - name: 실제 설정창 캡처
        shell: powershell
        env:
          GALLIUM_DRIVER: llvmpipe
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          & emulators/gens-ko/tests/windows_smoke.ps1 -SettingsProbe -IncludeShaderSettings -RealCrt -ExeDirectory "$env:RUNNER_TEMP/gens-ko-mesa-runtime" -OutputDirectory settings-proof
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gens-ko-settings-proof
          path: settings-proof/
          if-no-files-found: error
          retention-days: 30

  publish-modules:
    needs: [build, capture]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: gens-ko-settings-proof
          path: settings-proof
      - uses: actions/download-artifact@v4
        with:
          name: gens-ko-real-crt-proof
          path: real-crt-proof
      - name: 신규 코드와 실제 설정 화면 묶기
        run: python3 emulators/gens-ko/package_public.py
      - name: 신규 기능 모듈 시험 공개
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag='gens-ko-2.14-r3-modules'
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This immutable version already exists; no files are replaced.'
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --title 'Gens KO 2.14 R3 — Real CRT Phosphor·설정 화면' --notes-file emulators/gens-ko/RELEASE_NOTES_KO.txt release-assets/*
          fi
