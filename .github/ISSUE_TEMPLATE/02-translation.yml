name: '번역·글꼴·표시 오류'
description: '일본어 잔존, 오역, 폰트·띄어쓰기·줄바꿈 문제'
title: '[번역] 게임명 - 증상'
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: '화면 위치나 장면, 문제가 보이는 문구를 가능한 한 구체적으로 적어주세요.'
  - type: dropdown
    id: game
    attributes:
      label: 게임명
      options:
        - 'NDS - 스커지: 하이브'
        - 'GBC - 에스트폴리스 전기: 되살아나는 전설'
        - 'GBC - 포욘의 던전룸 2'
        - 'GB - 천지를 먹다'
        - 'SFC - 카오스 시드: 풍수회랑기'
        - 'SFC - 에스트폴리스 전기 II'
        - 'NDS - 프론트 미션 1st'
        - 'SFC - 실바 사가 II'
        - 'GBA - 에스트폴리스 외전: 침묵의 유적'
        - 'SFC - 미스틱 아크'
        - 'SFC - 초마법대륙 WOZZ'
        - 'SFC - 대괴수 이야기 II'
        - 'NDS - 세븐스 드래곤'
        - 'GBC - 스타오션: 블루스피어'
        - '기타 (게임명을 본문에 입력)'
    validations:
      required: true
  - type: input
    id: patch_version
    attributes:
      label: 패치 버전
      placeholder: '예: v0.9.9A / WIP271'
    validations:
      required: true
  - type: input
    id: emulator
    attributes:
      label: 기기 및 에뮬레이터
      placeholder: '예: iPhone / iOS / Manic Emu, 또는 SFC 실기'
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 문제 종류
      options:
        - '미번역·일본어 잔존'
        - '오역·문장 표현'
        - '한글 글리프·숫자·특수문자'
        - '글자 겹침·잘림·줄바꿈'
        - '창·커서 등 표시'
    validations:
      required: true
  - type: textarea
    id: scene
    attributes:
      label: 발생 장면과 현재 표시
      placeholder: '어느 화면에 어떤 글자가 나타나는지 적어주세요.'
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: 제안하는 수정 내용 (선택)
  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷·추가 정보
      description: '가능하면 문제가 보이는 화면을 첨부해 주세요. ROM 파일은 첨부하지 마세요.'
