name: '실행·프리징·그래픽 오류'
description: '게임 진행, 화면, 저장 및 속도 문제를 제보합니다.'
title: '[오류] 게임명 - 증상'
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: '오류 상황을 재현할 수 있도록 입력해 주세요. 원본 ROM·비밀번호·개인정보를 첨부하지 마세요. GitHub 계정이 필요합니다.'
  - type: dropdown
    id: game
    attributes:
      label: 게임명
      options:
        - 'NDS - 스커지: 하이브'
        - 'GBC - 에스트폴리스 전기: 되살아나는 전설'
        - 'GBC - 포욘의 던전룸 2'
        - 'GB - 천지를 먹다'
        - 'SFC - 카오스 시드: 풍수회랑기'
        - 'SFC - 에스트폴리스 전기 II'
        - 'NDS - 프론트 미션 1st'
        - 'SFC - 실바 사가 II'
        - 'GBA - 에스트폴리스 외전: 침묵의 유적'
        - 'SFC - 미스틱 아크'
        - 'SFC - 초마법대륙 WOZZ'
        - 'SFC - 대괴수 이야기 II'
        - 'NDS - 세븐스 드래곤'
        - 'GBC - 스타오션: 블루스피어'
        - '기타 (게임명을 본문에 입력)'
    validations:
      required: true
  - type: input
    id: patch_version
    attributes:
      label: 패치 버전
      placeholder: '예: v0.9.9A / WIP271'
    validations:
      required: true
  - type: input
    id: emulator
    attributes:
      label: 기기 및 에뮬레이터
      placeholder: '예: iPhone / iOS / Manic Emu, 또는 SFC 실기'
    validations:
      required: true
  - type: input
    id: rom_crc
    attributes:
      label: 원본 ROM CRC32 (알고 있다면)
      placeholder: '예: 507D57AD'
  - type: dropdown
    id: frequency
    attributes:
      label: 발생 빈도
      options:
        - '항상 재현됨'
        - '가끔 재현됨'
        - '한 번 발생함'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      placeholder: '게임 진행 위치 → 조작 순서 → 오류 발생 순간'
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 발생한 현상
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 정상일 때 기대하는 동작
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 화면 사진·추가 설명
      description: '스크린샷은 작성창에 끌어다 놓아 첨부할 수 있습니다. ROM 파일은 올리지 마세요.'
